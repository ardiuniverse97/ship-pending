name: Ship Pending

on:
  workflow_dispatch:

concurrency:
  group: ship-pending
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install library
        run: pip install requests

      - name: Run script
        run: python ship_pending.py
        env:
          _UID: ${{ secrets._UID }}
          REQUEST_ID: ${{ secrets.REQUEST_ID }}
          AUTH_HEADERS_URL: ${{ secrets.AUTH_HEADERS_URL }}
          SHIP_PENDING_URL: ${{ secrets.SHIP_PENDING_URL }}
          SHIP_PENDING_KEY: ${{ secrets.SHIP_PENDING_KEY }}
